<!-- Simple interaction script to simulate UI hiding -->
<script>
        let timeout;
        const uiLayer = document.getElementById('player-ui');
        
        function resetTimer() {
            uiLayer.style.opacity = '1';
            uiLayer.style.cursor = 'default';
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                uiLayer.style.opacity = '0';
                uiLayer.style.cursor = 'none';
            }, 3000);
        }

        document.addEventListener('mousemove', resetTimer);
        document.addEventListener('keypress', resetTimer);
        document.addEventListener('touchstart', resetTimer);
        
        // Initial setup
        resetTimer();
    </script>
